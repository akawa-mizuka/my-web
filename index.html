<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0" />
		<title>Drawer Tabs</title>
		<style>
			/* Reset & Basic Styling */
			* {
				box-sizing: border-box;
				font-family:
					system-ui,
					-apple-system,
					sans-serif;
			}

			body {
				background-color: #ffffff;
				padding: 40px;
				display: flex;
				justify-content: center;
			}

			.tabs-container {
				max-width: 600px;
				margin: 0 auto;
			}

			/* Tab Buttons */
			.tab-buttons {
				display: flex;
				gap: 16px;
				justify-content: center;
				margin-bottom: 24px;
			}

			.tab-btn {
				background-color: #e5e5e5;
				border: none;
				border-radius: 20px;
				padding: 10px 24px;
				font-size: 16px;
				font-weight: 700;
				cursor: pointer;
				transition:
					background-color 0.2s ease,
					transform 0.1s ease;
				color: #000;
			}

			.tab-btn:hover {
				background-color: #d4d4d4;
			}

			.tab-btn:active {
				transform: scale(0.95);
			}

			.tab-btn.active {
				background-color: #cccccc; /* Slightly darker when active */
			}

			/* Tab Content Wrapper (The Drawer Magic) */
			.tab-content-wrapper {
				display: grid;
				grid-template-rows: 0fr; /* Starts collapsed */
				transition:
					grid-template-rows 0.4s ease-out,
					margin 0.4s ease-out;
				border-radius: 16px;
				background-color: #d4d4d4; /* Matches Figma screenshot */
			}

			.tab-content-wrapper.open {
				grid-template-rows: 1fr; /* Expands to fit content */
				margin-bottom: 20px; /* Optional: adds space between open drawer and anything below it */
			}

			/* Inner content */
			.tab-inner {
				overflow: hidden; /* Required for the grid animation to work */
				min-height: 0; /* Required for the grid animation to work */
				padding: 0 32px; /* Starts with 0 vertical padding */
				opacity: 0;
				transition:
					padding 0.4s ease-out,
					opacity 0.3s ease-out;
			}

			.tab-content-wrapper.open .tab-inner {
				padding: 32px; /* Adds vertical padding only when open */
				opacity: 1;
			}

			/* Typography Inside Tabs */
			.tab-inner h3 {
				margin-top: 0;
				font-size: 24px;
				font-weight: 500;
			}

			.tab-inner p {
				font-size: 18px;
				margin-bottom: 12px;
			}

			.tab-inner ul {
				padding-left: 24px;
				font-size: 18px;
			}

			.tab-inner li {
				margin-bottom: 8px;
			}

			.tab-inner a {
				color: #000;
				text-decoration: underline;
			}
		</style>
	</head>
	<body>
		<div class="tabs-container">
			<div class="tab-buttons">
				<button
					class="tab-btn"
					data-target="credits"
					>credits</button
				>
				<button
					class="tab-btn"
					data-target="fandoms"
					>fandoms</button
				>
				<button
					class="tab-btn"
					data-target="faq"
					>faq</button
				>
				<button
					class="tab-btn"
					data-target="socials"
					>socials</button
				>
			</div>

			<div
				class="tab-content-wrapper"
				id="credits">
				<div class="tab-inner">
					<h3>Credits</h3>
					<p>Nothing here yet...</p>
				</div>
			</div>

			<div
				class="tab-content-wrapper"
				id="fandoms">
				<div class="tab-inner">
					<h3>Fandoms</h3>
					<p>Nothing here yet...</p>
				</div>
			</div>

			<div
				class="tab-content-wrapper"
				id="faq">
				<div class="tab-inner">
					<h3>FAQ</h3>
					<p>Nothing here yet...</p>
				</div>
			</div>

			<div
				class="tab-content-wrapper"
				id="socials">
				<div class="tab-inner">
					<h3>Socials</h3>
					<p>Follow me on my social media accounts:</p>
					<ul>
						<li><a href="#">Twitter</a></li>
						<li><a href="#">Instagram</a></li>
						<li><a href="#">ArtStation</a></li>
					</ul>
				</div>
			</div>
		</div>

		<script>
			// Select all our buttons and content wrappers
			const tabButtons = document.querySelectorAll(".tab-btn");
			const tabContents = document.querySelectorAll(".tab-content-wrapper");

			tabButtons.forEach((button) => {
				button.addEventListener("click", () => {
					const targetId = button.getAttribute("data-target");
					const targetContent = document.getElementById(targetId);

					// Check if the clicked tab is already open
					const isOpen = targetContent.classList.contains("open");

					// 1. Close ALL tabs first (this handles the "auto close others" request)
					tabContents.forEach((content) => content.classList.remove("open"));
					tabButtons.forEach((btn) => btn.classList.remove("active"));

					// 2. If the clicked tab was NOT open, open it now.
					// (If it was open, it just stays closed, completing the toggle effect)
					if (!isOpen) {
						targetContent.classList.add("open");
						button.classList.add("active");
					}
				});
			});
		</script>
	</body>
</html>
